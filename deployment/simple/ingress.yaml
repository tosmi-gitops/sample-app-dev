apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  namespace: sample-app
spec:
  defaultBackend:
    service:
      name: sample-app
      port:
        number: 8080
  ingressClassName: traefik
  rules:
  - host: sample-app.example.com
    http:
      paths:
      - backend:
          service:
            name: sample-app
            port:
              number: 8080
        path: /
        pathType: Prefix
